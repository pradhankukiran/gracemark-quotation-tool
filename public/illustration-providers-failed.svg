<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <g stroke="#047857" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Three provider nodes on the left -->
    <circle cx="24" cy="34" r="7" fill="#047857" fill-opacity="0.08"/>
    <circle cx="24" cy="64" r="7" fill="#047857" fill-opacity="0.08"/>
    <circle cx="24" cy="94" r="7" fill="#047857" fill-opacity="0.08"/>
    <!-- Central hub on the right -->
    <rect x="82" y="48" width="32" height="32" rx="4" fill="#047857" fill-opacity="0.06"/>
    <line x1="88" y1="58" x2="108" y2="58" stroke-opacity="0.5"/>
    <line x1="88" y1="64" x2="104" y2="64" stroke-opacity="0.5"/>
    <line x1="88" y1="70" x2="100" y2="70" stroke-opacity="0.5"/>
    <!-- Dashed broken connections -->
    <line x1="32" y1="34" x2="82" y2="56" stroke-dasharray="3 4" stroke-opacity="0.7"/>
    <line x1="32" y1="64" x2="82" y2="64" stroke-dasharray="3 4" stroke-opacity="0.7"/>
    <line x1="32" y1="94" x2="82" y2="72" stroke-dasharray="3 4" stroke-opacity="0.7"/>
    <!-- Warning glyph at the midpoint -->
    <circle cx="58" cy="64" r="10" fill="#ffffff" stroke="#047857"/>
    <circle cx="58" cy="64" r="10" fill="#047857" fill-opacity="0.08"/>
    <line x1="53" y1="59" x2="63" y2="69" stroke-width="2"/>
    <line x1="63" y1="59" x2="53" y2="69" stroke-width="2"/>
  </g>
</svg>
